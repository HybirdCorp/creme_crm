{% extends 'creme_core/menu/base.html' %}
{% block content %}<a href="{{entry.url}}"{% if entry.target %} target="{{entry.target}}"{% endif %}>{{entry.label}}</a>{% endblock %}

{% comment %}
{% if entry.permission_error %}
<span class="ui-creme-navigation-text-entry forbidden" title="{{ entry.permission_error }}">
    {{ entry.label }}
</span>
{% else %}
<a href="{{ entry.url }}">{{ entry.label }}</a>
{% endif %}
{% endcomment %}
